[build]
  publish = "."
  functions = "netlify/functions"

[functions.board]
  timeout = 26

[[redirects]]
  from = "/.env"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/GearUP.jpg"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/atis/:icao"
  to = "/.netlify/functions/atis?icao=:icao"
  status = 200

[[redirects]]
  from = "/api/taf/:icao"
  to = "/.netlify/functions/taf?icao=:icao"
  status = 200

[[redirects]]
  from = "/api/metar/:icao"
  to = "/.netlify/functions/metar?icao=:icao"
  status = 200

[[redirects]]
  from = "/api/airport/:icao"
  to = "/.netlify/functions/airport?icao=:icao"
  status = 200

[[redirects]]
  from = "/api/board"
  to = "/.netlify/functions/board"
  status = 200

[[redirects]]
  from = "/api/cdm"
  to = "/.netlify/functions/cdm"
  status = 200
  force = true

[[redirects]]
  from = "/api/briefwx/:icao"
  to = "/.netlify/functions/briefwx?icao=:icao"
  status = 200

[[redirects]]
  from = "/api/delay/:icao"
  to = "/.netlify/functions/delay?icao=:icao"
  status = 200

[[redirects]]
  from = "/api/fr24"
  to = "/.netlify/functions/fr24"
  status = 200

[[redirects]]
  from = "/api/hex/live"
  to = "/.netlify/functions/hex?kind=live"
  status = 200

[[redirects]]
  from = "/api/hex/reg/:reg"
  to = "/.netlify/functions/hex?kind=reg&id=:reg"
  status = 200

[[redirects]]
  from = "/api/hex/:hex"
  to = "/.netlify/functions/hex?kind=hex&id=:hex"
  status = 200

[[redirects]]
  from = "/globe"
  to = "/.netlify/functions/globe"
  status = 200
  force = true

[[redirects]]
  from = "/globe/"
  to = "/.netlify/functions/globe"
  status = 200
  force = true

# Live aircraft JSON / tiles: Cloudflare 403s Netlify's naked
# proxy when Referer is gearup4u. Same-origin function sets
# Referer/Origin to globe.airplanes.live (local server.js does this).
# Do not put ?asset= on these — that replaces ?binCraft&zstd&box=
# and airplanes.live returns 400 for binCraft= (equals-empty flags).
[[redirects]]
  from = "/globe/data/*"
  to = "/.netlify/functions/globe/data/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/globe/re-api/"
  to = "/.netlify/functions/globe/re-api/"
  status = 200
  force = true

[[redirects]]
  from = "/globe/re-api"
  to = "/.netlify/functions/globe/re-api/"
  status = 200
  force = true

[[redirects]]
  from = "/globe/re-api/*"
  to = "/.netlify/functions/globe/re-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/globe/*"
  to = "https://globe.airplanes.live/:splat"
  status = 200
  force = true

[[headers]]
  for = "/api/board"
  [headers.values]
    Cache-Control = "public, s-maxage=60, stale-while-revalidate=30"
    Netlify-CDN-Cache-Control = "public, s-maxage=60, stale-while-revalidate=30"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/api/cdm"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/globe"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/globe/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; media-src 'none'; frame-src 'self' https://mobile.ehamcdm.nl https://globe.airplanes.live; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
